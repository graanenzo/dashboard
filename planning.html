<style>
/* Zelfde huisstijl als het dashboard. Het hart van de pagina is de dagbalk: alle diensten van vandaag op één tijdlijn. */
:root {
  --bg: #f6f3ea; --paper: #fffdf7; --ink: #2b2618; --muted: #6f6752; --line: #e2dccb;
  --graan: #e8a600; --graan-ink: #5a4000; --graan-soft: #fbefc9;
  --ok: #2f7a4a; --ok-soft: #dcefe2; --warn: #b4441b; --warn-soft: #f8e1d6;
  --winkel: #d99a00; --restaurant: #7a4a6e; --magazijn: #1f6aa5;
  --winkel-soft: #fbefc9; --restaurant-soft: #efe2ec; --magazijn-soft: #dde9f4;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1913; --paper: #25221a; --ink: #f1ecdd; --muted: #a79f88; --line: #3a3528;
    --graan: #f2b623; --graan-ink: #fbe7b0; --graan-soft: #3d3216;
    --ok: #7ccb97; --ok-soft: #1f3527; --warn: #f0936c; --warn-soft: #3b2219;
    --winkel: #f2b623; --restaurant: #cf9ac3; --magazijn: #86b9e6;
    --winkel-soft: #3d3216; --restaurant-soft: #33232f; --magazijn-soft: #1c2c3b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1913; --paper: #25221a; --ink: #f1ecdd; --muted: #a79f88; --line: #3a3528;
  --graan: #f2b623; --graan-ink: #fbe7b0; --graan-soft: #3d3216;
  --ok: #7ccb97; --ok-soft: #1f3527; --warn: #f0936c; --warn-soft: #3b2219;
  --winkel: #f2b623; --restaurant: #cf9ac3; --magazijn: #86b9e6;
  --winkel-soft: #3d3216; --restaurant-soft: #33232f; --magazijn-soft: #1c2c3b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font-body); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--graan); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; margin: 0; letter-spacing: -0.01em; line-height: 1.15; }
.wrap { max-width: 1240px; margin-inline: auto; padding-inline: 16px; }

/* Kop */
header.top { background: var(--graan); color: #2b2000; position: sticky; top: 0; z-index: 5; }
.kopregel { display: flex; align-items: center; gap: 16px; padding-block: 8px; }
.brand-logo { height: 42px; width: auto; display: block; }
.who { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: .9rem; min-width: 0; }
.who span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who button { background: transparent; border: 1.5px solid #2b2000; color: #2b2000; border-radius: 6px; padding: 4px 10px; font-size: .85rem; white-space: nowrap; }
nav.hoofd { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.hoofd a { color: #2b2000; text-decoration: none; font-weight: 700; padding: 8px 14px; border-radius: 8px 8px 0 0; white-space: nowrap; }
nav.hoofd a[aria-current="page"] { background: var(--bg); color: var(--ink); }

main { padding-block: 24px 64px; }
.kop { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
.kop h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); margin-right: auto; }
.kop h1::first-letter { text-transform: uppercase; }
.sub { color: var(--muted); margin: -8px 0 16px; max-width: 70ch; }
h2 { font-size: 1.25rem; }

/* Knoppen en velden */
.btn { border: 1.5px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 14px; font-weight: 700; }
.btn:hover { border-color: var(--ink); }
.btn.primair { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.gevaar { color: var(--warn); border-color: var(--warn); background: transparent; }
.btn:disabled { opacity: .55; cursor: progress; }
label.veld { display: grid; gap: 4px; font-weight: 700; font-size: .9rem; }
input[type=text], input[type=password], input[type=date], input[type=time], input[type=number], select, textarea {
  padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--paper); width: 100%; font-weight: 400; min-width: 0;
}
.weeknav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.weeknav .btn { padding: 8px 12px; }
.weeknav strong { min-width: 8.5em; text-align: center; }
.check { display: inline-flex; gap: 8px; align-items: center; font-weight: 400; font-size: .92rem; }
.check input { width: 18px; height: 18px; accent-color: var(--ink); }
.melding { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: .95rem; max-width: calc(100% - 32px); z-index: 30; }
.melding.fout { background: var(--warn); color: #fff; }
.leeg { padding: 32px 16px; text-align: center; color: var(--muted); }
.leeg strong { display: block; font-family: var(--font-display); font-size: 1.2rem; color: var(--ink); margin-bottom: 4px; }

/* Inloggen */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.login form { background: var(--paper); border: 1.5px solid var(--line); border-top: 8px solid var(--graan); border-radius: 12px; padding: 28px; width: min(100%, 380px); display: grid; gap: 14px; }
.login-logo { width: 190px; max-width: 70%; justify-self: center; }
.login-logo img { width: 100%; height: auto; display: block; }
.login h1 { font-size: 1.7rem; }
.login p { margin: 0; color: var(--muted); font-size: .95rem; }
.login .fout { color: var(--warn); font-size: .9rem; min-height: 1.2em; }

/* Klokstrook */
.klok { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; background: var(--ink); color: var(--paper); border-radius: 12px; padding: 16px 20px; margin-bottom: 24px; }
.klok .tekst { flex: 1 1 260px; }
.klok .tekst b { font-family: var(--font-display); font-size: 1.3rem; display: block; line-height: 1.2; }
.klok .tekst span { opacity: .8; font-size: .95rem; }
.klok .actie { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.klok .actie .btn { color: var(--ink); }
.klok select { width: auto; background: transparent; border-color: currentColor; color: inherit; }
.klok select option { color: #2b2618; }
.klokknop { background: var(--graan); color: #2b2000; border: 0; border-radius: 10px; padding: 13px 28px; font-weight: 800; font-size: 1.1rem; font-family: var(--font-display); }
.klokknop:disabled { opacity: .6; cursor: progress; }
.klok.binnen .klokknop { background: var(--paper); color: var(--ink); }
.klok.let { background: var(--warn-soft); color: var(--ink); border: 1.5px solid var(--warn); }

/* Dagbalk: alle diensten op één tijdlijn */
.dagbalk { background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 0 12px; margin-bottom: 32px; --naam: 170px; }
.as { position: relative; height: 24px; margin-left: var(--naam); margin-right: 20px; font-size: .78rem; color: var(--muted); }
.as span { position: absolute; transform: translateX(-50%); top: 4px; }
.afd-kop { display: flex; align-items: baseline; gap: 10px; padding: 12px 20px 4px; }
.afd-kop h2 { font-size: 1.05rem; }
.afd-kop .stip { width: 12px; height: 12px; border-radius: 3px; background: var(--kleur); align-self: center; }
.afd-kop small { color: var(--muted); }
.rij { display: grid; grid-template-columns: var(--naam) 1fr; align-items: center; padding-right: 20px; min-height: 40px; }
.rij .naam { padding-left: 20px; padding-right: 10px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spoor { position: relative; height: 32px; }
.spoor .lijn { position: absolute; top: -4px; bottom: -4px; width: 1px; background: var(--line); }
.spoor .nu { position: absolute; top: -8px; bottom: -8px; width: 2px; background: var(--warn); z-index: 2; }
.balk { position: absolute; top: 3px; bottom: 3px; border-radius: 6px; border: 2px solid var(--kleur); padding: 0 8px; display: flex; align-items: center; gap: 8px; font-size: .85rem; white-space: nowrap; overflow: hidden; background: var(--paper); z-index: 1; }
.balk.binnen { background: var(--kleur); color: var(--opkleur); font-weight: 700; }
.balk.klaar { background: var(--zacht); }
.geen { color: var(--muted); padding: 2px 20px 10px; font-size: .92rem; }
.kl-winkel { --kleur: var(--winkel); --zacht: var(--winkel-soft); --opkleur: #2b2000; }
.kl-restaurant { --kleur: var(--restaurant); --zacht: var(--restaurant-soft); --opkleur: #fff; }
.kl-magazijn { --kleur: var(--magazijn); --zacht: var(--magazijn-soft); --opkleur: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .kl-restaurant, :root:not([data-theme="light"]) .kl-magazijn { --opkleur: #1b1913; } }
:root[data-theme="dark"] .kl-restaurant, :root[data-theme="dark"] .kl-magazijn { --opkleur: #1b1913; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 20px 0; font-size: .82rem; color: var(--muted); }
.legenda i { display: inline-block; width: 22px; height: 11px; border-radius: 3px; border: 2px solid var(--muted); vertical-align: -1px; margin-right: 5px; }
.legenda i.v { background: var(--muted); }

/* Weekoverzicht */
.schuif { overflow-x: auto; border: 1.5px solid var(--line); border-radius: 12px; background: var(--paper); }
table.week { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 760px; font-size: .9rem; }
table.week th, table.week td { padding: 8px 10px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); vertical-align: top; text-align: left; }
table.week thead th { background: var(--paper); font-weight: 700; white-space: nowrap; }
table.week th:first-child, table.week td:first-child { border-left: 0; position: sticky; left: 0; background: var(--paper); z-index: 1; width: 130px; min-width: 130px; }
table.week tr:last-child > * { border-bottom: 0; }
th.vandaag { background: var(--graan-soft) !important; }
td.vandaag { background: color-mix(in srgb, var(--graan-soft) 45%, transparent); }
td.dicht { background: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--line) 55%, transparent) 6px 8px); }
.chip { display: block; width: 100%; text-align: left; border: 0; border-left: 4px solid var(--kleur); background: var(--zacht); border-radius: 4px; padding: 3px 7px; margin-bottom: 4px; line-height: 1.25; }
.chip b { display: block; font-weight: 700; }
.chip small { font-size: .82rem; }
button.chip:hover { outline: 1.5px solid var(--kleur); }
.afdcel { display: flex; gap: 8px; align-items: center; font-weight: 700; }
.afdcel .stip { width: 12px; height: 12px; border-radius: 3px; background: var(--kleur); }

/* Beschikbaarheid */
.dagen { display: grid; gap: 8px; max-width: 760px; }
.dag { background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: 7.5em 1fr; gap: 8px 14px; align-items: center; }
.dag.vandaag { border-color: var(--graan); }
.dag.verleden { opacity: .6; }
.dag .datum b { display: block; }
.dag .datum small { color: var(--muted); }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { background: transparent; border: 0; padding: 7px 12px; font-weight: 700; font-size: .92rem; border-left: 1.5px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"][data-s="beschikbaar"] { background: var(--ok); color: var(--paper); }
.seg button[aria-pressed="true"][data-s="deels"] { background: var(--graan); color: #2b2000; }
.seg button[aria-pressed="true"][data-s="niet"] { background: var(--ink); color: var(--paper); }
.extra { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.extra input[type=time] { width: 7.2em; }
.extra input[type=text] { flex: 1 1 180px; }

/* Plannen */
.planafd { margin-bottom: 24px; }
.planafd > .afd-kop { padding: 0 0 8px; }
td.cel { padding: 6px; min-width: 112px; }
.besch { display: block; font-size: .78rem; margin-bottom: 4px; color: var(--muted); }
.besch.beschikbaar { color: var(--ok); font-weight: 700; }
.besch.deels { color: var(--graan-ink); font-weight: 700; }
.besch.niet { color: var(--warn); font-weight: 700; }
.plus { width: 100%; border: 1.5px dashed var(--line); background: transparent; color: var(--muted); border-radius: 4px; padding: 2px; font-weight: 700; }
.plus:hover { border-color: var(--ink); color: var(--ink); }

/* Uren */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 16px; }
.filters .veld { min-width: 9em; flex: 0 1 11em; }
.waarschuwing { background: var(--warn-soft); border: 1.5px solid var(--warn); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
.urenblok { background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
.urenkop { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 12px 16px; }
.urenkop h2 { margin-right: auto; }
.urenkop strong { font-family: var(--font-display); font-size: 1.15rem; }
.urenschuif { overflow-x: auto; }
table.uren { border-collapse: collapse; width: 100%; font-size: .92rem; min-width: 640px; }
table.uren th, table.uren td { text-align: left; padding: 7px 10px; border-top: 1px solid var(--line); white-space: nowrap; }
table.uren th { font-size: .82rem; color: var(--muted); font-weight: 700; }
table.uren .n { text-align: right; }
table.uren th:first-child, table.uren td:first-child { padding-left: 16px; }
table.uren tr.mist td { color: var(--warn); }
table.uren td.acties { text-align: right; width: 1%; padding-right: 12px; }
table.uren td.acties button { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 2px 8px; font-size: .82rem; }
.vlag { font-size: .8rem; color: var(--warn); font-weight: 700; }
.vlag.stil { color: var(--muted); font-weight: 400; }
.printkop { display: none; }

/* Medewerkers */
.lijst { background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; }
.lijst > div { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.lijst > div:first-child { border-top: 0; }
.lijst .nm { flex: 1 1 200px; }
.lijst .nm b { display: block; }
.lijst .nm small { color: var(--muted); }
.lijst .af { display: inline-flex; gap: 5px; flex-wrap: wrap; }
.tag { font-size: .8rem; border-radius: 4px; padding: 1px 7px; background: var(--zacht, var(--line)); border-left: 3px solid var(--kleur, var(--muted)); }
.uit { opacity: .55; }

/* Dialoog */
dialog { border: 1.5px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink); padding: 0; width: min(440px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(30,25,10,.45); }
dialog form { padding: 20px; display: grid; gap: 12px; }
dialog h2 { font-size: 1.3rem; }
dialog .twee { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
dialog .knoppen { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
dialog .knoppen .rechts { margin-left: auto; display: flex; gap: 8px; }
dialog .hint { font-size: .9rem; border-radius: 6px; padding: 6px 10px; background: var(--warn-soft); }
dialog .sub2 { color: var(--muted); font-size: .92rem; margin: -6px 0 0; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; }
legend { font-weight: 700; font-size: .9rem; padding: 0; margin-bottom: 4px; }

@media (max-width: 640px) {
  .dagbalk { --naam: 12px; }
  .rij { grid-template-columns: 1fr; padding-inline: 12px; margin-bottom: 4px; }
  .rij .naam { padding: 0; font-size: .92rem; }
  .as { margin-right: 12px; }
  .afd-kop { padding-inline: 12px; }
  .geen, .legenda { padding-inline: 12px; }
  .balk { font-size: .8rem; padding: 0 5px; }
  .dag { grid-template-columns: 1fr; }
  .extra { grid-column: 1; }
  .who span { display: none; }
  .brand-logo { height: 36px; }
  main { padding-block: 16px 64px; }
}

/* Printen: alleen het urenoverzicht */
@media print {
  @page { size: A4; margin: 14mm; }
  :root { --bg: #fff; --paper: #fff; --ink: #000; --muted: #444; --line: #bbb; --warn: #000; color-scheme: light; }
  body { background: #fff; color: #000; font-size: 10.5pt; }
  header.top, .kop, .filters, .sub, .melding, .acties, dialog, .waarschuwing.scherm, nav { display: none !important; }
  main, .wrap { padding: 0 !important; max-width: none; }
  .printkop { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 14px; }
  .printkop img { height: 44px; }
  .printkop h1 { font-size: 18pt; }
  .printkop p { margin: 2px 0 0; }
  .urenblok { border: 0; border-radius: 0; margin-bottom: 18pt; break-inside: avoid; overflow: visible; }
  .urenkop { padding: 0 0 4pt; }
  .urenschuif { overflow: visible; }
  table.uren { min-width: 0; font-size: 9.5pt; }
  table.uren th, table.uren td { padding: 3pt 5pt; border-top: 1px solid #bbb; }
  table.uren th:first-child, table.uren td:first-child { padding-left: 0; }
  tr.mist td { font-style: italic; }
  .waarschuwing { background: none; border: 1px solid #000; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const opslag = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

if (typeof supabase === "undefined") {
  document.body.innerHTML = '<p style="padding:24px;font-family:system-ui">De pagina kon niet laden. Controleer je internetverbinding en ververs de pagina.</p>';

// Eigen sessie: wie op dezelfde computer in het dashboard is ingelogd, is hier niet automatisch ingelogd.
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: "gz-planning-auth" } });

/* ---------- datum en tijd ---------- */
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const vanIso = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const plus = (s, n) => { const d = vanIso(s); d.setDate(d.getDate() + n); return iso(d); };
const vandaag = () => iso(new Date());
const maandag = (s) => { const d = vanIso(s); return plus(s, -((d.getDay() + 6) % 7)); };
const weekNr = (s) => { const d = vanIso(plus(maandag(s), 3)); const j = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - j) / 864e5 + (j.getDay() + 6) % 7 - 3) / 7); };
const fmt = (s, o) => new Intl.DateTimeFormat("nl-NL", o).format(vanIso(s));
const dagLang = (s) => fmt(s, { weekday: "long", day: "numeric", month: "long" });
const dagKort = (s) => fmt(s, { weekday: "short", day: "numeric", month: "short" });
const tijd = (t) => (t || "").slice(0, 5);
const klokTijd = (ts) => ts ? new Date(ts).toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" }) : "";
const minuten = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const urenTekst = (min) => `${Math.floor(min / 60)}:${String(Math.round(min % 60)).padStart(2, "0")}`;
const urenDec = (min) => (min / 60).toLocaleString("nl-NL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dienstMin = (d) => minuten(tijd(d.eind_tijd)) - minuten(tijd(d.start_tijd));
const klokMin = (k) => k.uit_tijd ? Math.max(0, Math.round((new Date(k.uit_tijd) - new Date(k.in_tijd)) / 6e4) - (k.pauze_minuten || 0)) : 0;
const afdOpen = (afd, s) => AFD[afd].open.includes(vanIso(s).getDay());

let ik = null;
let medewerkers = [];
let weergave = "vandaag";
let weekStart = maandag(vandaag());
let klokBezig = false;
let verversTimer = null;
let kanaal = null;
const urenFilter = { van: null, tot: null, afdeling: "", medewerker: "" };
const isBeheerder = () => ik && ik.rol === "beheerder";
const mw = (id) => medewerkers.find((m) => m.id === id);
const naamVan = (id) => mw(id)?.naam ?? "Onbekend";
// Op maandag en zondag wordt nooit gewerkt: het rooster loopt van dinsdag (1) t/m zaterdag (5) vanaf de maandag van de week.
const weekDagen = () => [1, 2, 3, 4, 5].map((i) => plus(weekStart, i));

function melding(tekst, fout = false) {
  const el = $("melding");
  el.textContent = tekst;
  el.className = "melding" + (fout ? " fout" : "");
  el.hidden = false;
  clearTimeout(melding.t);
  melding.t = setTimeout(() => (el.hidden = true), fout ? 7000 : 2800);
}
const check = ({ data, error }) => { if (error) throw error; return data; };
const foutTekst = (e) => {
  const m = e?.message || String(e);
  if (/row-level security|permission denied/i.test(m)) return "Daar heb je geen rechten voor.";
  if (/fetch|network/i.test(m)) return "Geen verbinding. Controleer je internet en probeer het opnieuw.";
  return m;
};

  { id: "beschikbaarheid", naam: "Beschikbaarheid" },

];

}
async function toon() {

/* ---------- Vandaag ---------- */
async function haalDiensten(van, tot) {
  return check(await sb.from("diensten").select("*").gte("datum", van).lte("datum", tot).order("start_tijd"));
}
function kolomAfd(a) { return `kl-${a}`; }

async function tekenVandaag() {
  const nu = vandaag();
  const week = weekDagen();
  const [diensten, aanwezig, mijnKlok, weekDiensten] = await Promise.all([
    haalDiensten(nu, nu),
    sb.rpc("aanwezig_vandaag").then(check),
    sb.from("kloktijden").select("*").eq("medewerker_id", ik.id).gte("datum", plus(nu, -14)).lte("datum", nu).order("in_tijd").then(check),
    haalDiensten(plus(weekStart, 0), plus(weekStart, 6)),
  ]);
  const status = Object.fromEntries(aanwezig.map((a) => [a.medewerker_id, a.ingeklokt ? "binnen" : "klaar"]));
  $("inhoud").innerHTML = `
    <div class="kop"><h1>${esc(dagLang(nu))}</h1></div>
    ${klokHtml(diensten, mijnKlok)}
    ${dagbalkHtml(diensten, status, nu)}
    <div class="kop"><h2 style="margin-right:auto">Wie werkt er deze week</h2>${weekNavHtml()}</div>
    ${weekHtml(week, weekDiensten)}`;
  bindKlok();
}

let mijnKlokRijen = [];
function klokHtml(diensten, mijnKlok) {
  mijnKlokRijen = mijnKlok;
  const nu = vandaag();
  const vergeten = mijnKlok.filter((k) => !k.uit_tijd && k.datum < nu);
  const open = mijnKlok.find((k) => !k.uit_tijd && k.datum === nu);
  const mijn = diensten.filter((d) => d.medewerker_id === ik.id);
  const gewerkt = mijnKlok.filter((k) => k.datum === nu && k.uit_tijd);
  const melding2 = vergeten.length ? `<div class="klok let" style="margin-bottom:12px"><div class="tekst"><b>Je bent niet uitgeklokt op ${esc(dagKort(vergeten[0].datum))}</b><span>Vul je uittijd in, dan tellen deze uren weer mee.</span></div><div class="actie"><button class="btn" type="button" data-eigen="${vergeten[0].id}">Uittijd invullen</button></div></div>` : "";
  if (open) {
    return melding2 + `<section class="klok binnen" aria-label="Klokken">
      <div class="tekst"><b>Ingeklokt om ${klokTijd(open.in_tijd)}</b><span>${esc(AFD[open.afdeling]?.naam ?? "")}</span></div>
      <div class="actie"><button class="btn" type="button" data-eigen="${open.id}">Tijd aanpassen</button><button class="klokknop" id="uitKlok" type="button">Uitklokken</button></div>
    </section>`;
  }
  const rooster = mijn.map((d) => `${tijd(d.start_tijd)} tot ${tijd(d.eind_tijd)} in ${AFD[d.afdeling].naam.toLowerCase()}`).join(", ");
  const kop = gewerkt.length ? `Uitgeklokt om ${klokTijd(gewerkt[gewerkt.length - 1].uit_tijd)}` : mijn.length ? "Je werkt vandaag" : "Je staat vandaag niet ingepland";
  const kies = mijn.length === 0 || new Set(mijn.map((d) => d.afdeling)).size > 1;
  const opties = (kies && mijn.length ? [...new Set(mijn.map((d) => d.afdeling))] : (ik.afdelingen?.length ? ik.afdelingen : AFD_IDS));
  return melding2 + `<section class="klok" aria-label="Klokken">
    <div class="tekst"><b>${esc(kop)}</b><span>${esc(rooster || "Kom je toch werken? Kies je afdeling en klok in.")}</span></div>
    <div class="actie">
      ${kies ? `<select id="klokAfd" aria-label="Afdeling">${opties.map((a) => `<option value="${a}">${AFD[a].naam}</option>`).join("")}</select>` : ""}
      ${gewerkt.length ? `<button class="btn" type="button" data-eigen="${gewerkt[gewerkt.length - 1].id}">Tijden aanpassen</button>` : ""}
      <button class="klokknop" id="inKlok" type="button">Inklokken</button>
    </div>
  </section>`;
}

function bindKlok() {
  $("inKlok")?.addEventListener("click", async (e) => {
    if (klokBezig) return;
    klokBezig = true; e.target.disabled = true;
    try {
      const k = check(await sb.rpc("inklokken", { p_afdeling: $("klokAfd")?.value ?? null }));
      await naKlokken(`Ingeklokt om ${klokTijd(k.in_tijd)}`);
    } catch (err) { melding(foutTekst(err), true); e.target.disabled = false; }
    klokBezig = false;
  });
  $("uitKlok")?.addEventListener("click", openUitklokken);
  $("inhoud").querySelectorAll("[data-eigen]").forEach((k) => k.addEventListener("click", () => {
    eigenUrenDialoog(mijnKlokRijen.find((x) => x.id === k.dataset.eigen));
  }));
}

function dagbalkHtml(diensten, status, datum) {
  const nuMin = new Date().getHours() * 60 + new Date().getMinutes();
  let van = 8 * 60, tot = 20 * 60;
  for (const d of diensten) { van = Math.min(van, minuten(tijd(d.start_tijd))); tot = Math.max(tot, minuten(tijd(d.eind_tijd))); }
  van = Math.floor(van / 60) * 60; tot = Math.ceil(tot / 60) * 60;
  const pos = (m) => ((m - van) / (tot - van)) * 100;
  const stap = tot - van > 12 * 60 ? 180 : 120;
  const uren = [];
  for (let m = van; m <= tot; m += stap) uren.push(m);
  const lijnen = uren.map((m) => `<i class="lijn" style="left:${pos(m)}%"></i>`).join("");
  const nuLijn = nuMin >= van && nuMin <= tot ? `<i class="nu" style="left:${pos(nuMin)}%" title="Nu"></i>` : "";
  const blokken = AFD_IDS.map((a) => {
    const rijen = diensten.filter((d) => d.afdeling === a);
    const dicht = !afdOpen(a, datum);
    if (!rijen.length && dicht) return "";
    const perNaam = [...new Set(rijen.map((d) => d.medewerker_id))].sort((x, y) => naamVan(x).localeCompare(naamVan(y)));
    return `<div class="${kolomAfd(a)}">
      <div class="afd-kop"><span class="stip"></span><h2>${AFD[a].naam}</h2><small>${perNaam.length ? (perNaam.length === 1 ? "1 persoon" : perNaam.length + " personen") : ""}</small></div>
      ${perNaam.length ? perNaam.map((id) => {
        const st = status[id];
        const balken = rijen.filter((d) => d.medewerker_id === id).map((d) => {
          const s = minuten(tijd(d.start_tijd)), e = minuten(tijd(d.eind_tijd));
          const lab = st === "binnen" ? "Binnen" : st === "klaar" ? "Klaar" : "";
          return `<div class="balk ${st || ""}" style="left:${pos(s)}%;width:${pos(e) - pos(s)}%" title="${esc(naamVan(id))}: ${tijd(d.start_tijd)} tot ${tijd(d.eind_tijd)}">${tijd(d.start_tijd)}–${tijd(d.eind_tijd)}${lab ? ` <span>${lab}</span>` : ""}</div>`;
        }).join("");
        return `<div class="rij"><div class="naam" title="${esc(naamVan(id))}">${esc(naamVan(id))}</div><div class="spoor">${lijnen}${nuLijn}${balken}</div></div>`;
      }).join("") : `<div class="geen">Nog niemand ingepland.</div>`}
    </div>`;
  }).join("");
  if (!blokken) return `<div class="dagbalk"><div class="leeg"><strong>Vandaag gesloten</strong>Er staat niemand op het rooster.</div></div>`;
  return `<section class="dagbalk" aria-label="Rooster van vandaag">
    <div class="as" aria-hidden="true">${uren.map((m) => `<span style="left:${pos(m)}%">${String(m / 60).padStart(2, "0")}:00</span>`).join("")}</div>
    ${blokken}
    <div class="legenda"><span><i></i>Ingepland</span><span><i class="v"></i>Ingeklokt</span>${nuLijn ? `<span style="color:var(--warn)">De rode lijn is nu</span>` : ""}</div>
  </section>`;
}

function weekHtml(dagen, diensten) {
  const nu = vandaag();
  return `<div class="schuif"><table class="week">
    <thead><tr><th>Afdeling</th>${dagen.map((s) => `<th class="${s === nu ? "vandaag" : ""}">${esc(dagKort(s))}</th>`).join("")}</tr></thead>
    <tbody>${AFD_IDS.map((a) => `<tr class="${kolomAfd(a)}">
      <td><span class="afdcel"><span class="stip"></span>${AFD[a].naam}</span></td>
      ${dagen.map((s) => {
        const hier = diensten.filter((d) => d.datum === s && d.afdeling === a);
        const kl = [s === nu ? "vandaag" : "", !hier.length && !afdOpen(a, s) ? "dicht" : ""].join(" ");
        return `<td class="${kl}">${hier.map((d) => `<div class="chip"><b>${esc(naamVan(d.medewerker_id))}</b><small>${tijd(d.start_tijd)}–${tijd(d.eind_tijd)}</small></div>`).join("")}</td>`;
      }).join("")}
    </tr>`).join("")}</tbody></table></div>`;
}

/* ---------- Beschikbaarheid ---------- */
async function tekenBeschikbaarheid() {
  const dagen = weekDagen();
  const eigen = check(await sb.from("beschikbaarheid").select("*").eq("medewerker_id", ik.id).gte("datum", dagen[0]).lte("datum", dagen[dagen.length - 1]));
  const per = Object.fromEntries(eigen.map((b) => [b.datum, b]));
  const nu = vandaag();
  $("inhoud").innerHTML = `
    <div class="kop"><h1>Beschikbaarheid</h1>${weekNavHtml()}</div>
    <p class="sub">Geef per dag door of je kunt werken. Het wordt meteen opgeslagen en alleen de beheerders zien het.</p>
    <div class="kop" style="margin-bottom:12px">
      <button class="btn" id="heleWeek" type="button">Hele week beschikbaar</button>
      <button class="btn" id="vorigeWeek" type="button">Neem vorige week over</button>
      <button class="btn" id="patroonBesch" type="button">Patroon toevoegen</button>
    </div>
    <div class="dagen">${dagen.map((s) => {
      const b = per[s];
      const st = b?.status;
      return `<div class="dag ${s === nu ? "vandaag" : ""} ${s < nu ? "verleden" : ""}" data-datum="${s}">
        <div class="datum"><b>${esc(fmt(s, { weekday: "long" }))}</b><small>${esc(fmt(s, { day: "numeric", month: "long" }))}</small></div>
        <div class="seg" role="group" aria-label="Beschikbaarheid ${esc(dagLang(s))}">
          ${[["beschikbaar", "Beschikbaar"], ["deels", "Deels"], ["niet", "Niet"]].map(([k, l]) => `<button type="button" data-s="${k}" aria-pressed="${st === k}">${l}</button>`).join("")}
        </div>
        ${st ? `<div class="extra">
          ${st === "deels" ? `<input type="time" data-veld="van" value="${tijd(b.van)}" aria-label="Van"> tot <input type="time" data-veld="tot" value="${tijd(b.tot)}" aria-label="Tot">` : ""}
          <input type="text" data-veld="opmerking" value="${esc(b.opmerking)}" placeholder="Opmerking, bijvoorbeeld tandarts" aria-label="Opmerking">
        </div>` : ""}
      </div>`;
    }).join("")}</div>`;

  const sla = async (rij) => {
    check(await sb.from("beschikbaarheid").upsert({ medewerker_id: ik.id, bijgewerkt_op: new Date().toISOString(), ...rij }, { onConflict: "medewerker_id,datum" }));
  };
  $("inhoud").querySelectorAll(".seg button").forEach((k) => k.addEventListener("click", async () => {
    const datum = k.closest(".dag").dataset.datum;
    const oud = per[datum];
    try {
      if (oud?.status === k.dataset.s) {
        check(await sb.from("beschikbaarheid").delete().eq("medewerker_id", ik.id).eq("datum", datum));
      } else {
        const deels = k.dataset.s === "deels";
        await sla({ datum, status: k.dataset.s, van: deels ? (oud?.van || "09:00") : null, tot: deels ? (oud?.tot || "17:00") : null, opmerking: oud?.opmerking ?? null });
      }
      ververs();
    } catch (e) { melding(foutTekst(e), true); }
  }));
  $("inhoud").querySelectorAll(".extra input").forEach((inp) => inp.addEventListener("change", async () => {
    const dag = inp.closest(".dag");
    const datum = dag.dataset.datum;
    const oud = per[datum];
    const van = dag.querySelector('[data-veld="van"]')?.value ?? null;
    const tot = dag.querySelector('[data-veld="tot"]')?.value ?? null;
    if (oud.status === "deels" && (!van || !tot || tot <= van)) { melding("De eindtijd moet na de begintijd liggen.", true); return; }
    try {
      await sla({ datum, status: oud.status, van, tot, opmerking: dag.querySelector('[data-veld="opmerking"]').value.trim() || null });
      per[datum] = { ...oud, van, tot };
      melding("Opgeslagen");
    } catch (e) { melding(foutTekst(e), true); }
  }));
  $("heleWeek").addEventListener("click", async () => {
    const rijen = dagen.filter((s) => s >= nu && !per[s]).map((s) => ({ medewerker_id: ik.id, datum: s, status: "beschikbaar" }));
    if (!rijen.length) { melding("Alle dagen zijn al ingevuld."); return; }
    try {
      check(await sb.from("beschikbaarheid").upsert(rijen, { onConflict: "medewerker_id,datum" }));
      ververs();
    } catch (e) { melding(foutTekst(e), true); }
  });
  $("patroonBesch").addEventListener("click", beschPatroonDialoog);
  $("vorigeWeek").addEventListener("click", async () => {
    try {
      const vorige = check(await sb.from("beschikbaarheid").select("*").eq("medewerker_id", ik.id).gte("datum", plus(weekStart, -7)).lte("datum", plus(weekStart, -1)));
      const rijen = vorige.map((b) => ({ medewerker_id: ik.id, datum: plus(b.datum, 7), status: b.status, van: b.van, tot: b.tot, opmerking: null })).filter((r) => r.datum >= nu && !per[r.datum]);
      if (!rijen.length) { melding("Er is niets om over te nemen."); return; }
      check(await sb.from("beschikbaarheid").upsert(rijen, { onConflict: "medewerker_id,datum" }));
      ververs();
    } catch (e) { melding(foutTekst(e), true); }
  });
}

const PATROON_MAX_DAGEN = 366;
const PATROON_STANDAARD_DAGEN = 91;
function patroonDatums(eerste, stap, tot) {
  const uit = [];
  for (let s = eerste; s <= tot; s = plus(s, stap)) uit.push(s);
  return uit;
}
function controleerPatroonEinde(van, tot) {
  if (!tot) throw new Error("Kies tot wanneer het patroon doorloopt.");
  if (tot < van) throw new Error("De einddatum moet na de startdatum liggen.");
  if (tot > plus(van, PATROON_MAX_DAGEN)) throw new Error("Een patroon kan maximaal een jaar vooruit.");
}
const nieuweId = () => crypto.randomUUID ? crypto.randomUUID()
  : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) => (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16));

      <label class="veld">Hoe vaak <select id="pStap"><option value="7">Elke week</option><option value="14">Om de week</option></select></label>
    </div>
    <label class="veld">Beschikbaarheid <select id="pStatus">
      <option value="beschikbaar">Beschikbaar</option><option value="deels">Deels</option><option value="niet">Niet beschikbaar</option><option value="leeg">Leegmaken</option>
    </select></label>
    <div class="twee" id="pTijden" hidden>
      <label class="veld">Van <input type="time" id="pVan" value="09:00"></label>
      <label class="veld">Tot <input type="time" id="pTot" value="17:00"></label>
    </div>
    <div class="twee">
      <label class="veld">Vanaf <input type="date" id="pStart" value="${start}" min="${nu}" required></label>
      <label class="veld">Tot en met <input type="date" id="pEinde" value="${plus(start, PATROON_STANDAARD_DAGEN)}" min="${nu}" required></label>
    </div>
    <label class="veld" id="pOpmVeld">Opmerking <input type="text" id="pOpm" placeholder="Bijvoorbeeld studie"></label>
    <div class="hint" id="pHint" hidden>Dit haalt alle ingevulde dagen weg die in het patroon vallen, ook losse opmerkingen.</div>
    <div class="knoppen"><div class="rechts"><button class="btn" type="button" data-sluit>Annuleren</button><button class="btn primair" type="submit">Toevoegen</button></div></div>
  </form>`, async () => {
    const status = $("pStatus").value, van = $("pStart").value, tot = $("pEinde").value, dag = Number($("pDag").value);
    controleerPatroonEinde(van, tot);
    if (status === "deels" && $("pTot").value <= $("pVan").value) throw new Error("De eindtijd moet na de begintijd liggen.");
    let eerste = van;
    while (vanIso(eerste).getDay() !== dag) eerste = plus(eerste, 1);
    const datums = patroonDatums(eerste, Number($("pStap").value), tot);
    if (!datums.length) throw new Error("Er valt geen dag in deze periode.");
    if (status === "leeg") {
      check(await sb.from("beschikbaarheid").delete().eq("medewerker_id", ik.id).in("datum", datums));
      sluitDialoog(); melding("Patroon leeggemaakt"); ververs();
      return;
    }
    const bestaand = check(await sb.from("beschikbaarheid").select("datum").eq("medewerker_id", ik.id).in("datum", datums));
    const bezet = new Set(bestaand.map((b) => b.datum));
    const deels = status === "deels";
    const rijen = datums.filter((s) => !bezet.has(s)).map((s) => ({
      medewerker_id: ik.id, datum: s, status, van: deels ? $("pVan").value : null, tot: deels ? $("pTot").value : null, opmerking: $("pOpm").value.trim() || null,
    }));
    if (!rijen.length) { melding("Alle dagen in dit patroon zijn al ingevuld."); return; }
    check(await sb.from("beschikbaarheid").insert(rijen));
    sluitDialoog();
    melding(`${rijen.length} ${rijen.length === 1 ? "dag" : "dagen"} ingevuld${bezet.size ? `, ${bezet.size} al ingevuld` : ""}`);
    ververs();
  });
  $("pStatus").addEventListener("change", () => {
    const st = $("pStatus").value;
    $("pTijden").hidden = st !== "deels";
    $("pOpmVeld").hidden = st === "leeg";
    $("pHint").hidden = st !== "leeg";
  });
}

/* ---------- Plannen ---------- */
let planData = { diensten: [], besch: [] };
async function tekenPlannen() {
  const dagen = weekDagen();
  const eind = plus(weekStart, 6);
  await laadMedewerkers();
  const [diensten, besch] = await Promise.all([
    haalDiensten(weekStart, eind),
    sb.from("beschikbaarheid").select("*").gte("datum", weekStart).lte("datum", eind).then(check),
  ]);
  planData = { diensten, besch };
  const nu = vandaag();
  const actief = medewerkers.filter((m) => m.actief);
  const secties = AFD_IDS.map((a) => {
    const ids = new Set(actief.filter((m) => m.afdelingen.includes(a)).map((m) => m.id));
    diensten.filter((d) => d.afdeling === a).forEach((d) => ids.add(d.medewerker_id));
    const rijen = [...ids].sort((x, y) => naamVan(x).localeCompare(naamVan(y)));
    return `<section class="planafd ${kolomAfd(a)}">
      <div class="afd-kop"><span class="stip"></span><h2>${AFD[a].naam}</h2></div>
      ${rijen.length ? `<div class="schuif"><table class="week"><thead><tr><th>Medewerker</th>${dagen.map((s) => `<th class="${s === nu ? "vandaag" : ""}">${esc(dagKort(s))}</th>`).join("")}</tr></thead>
      <tbody>${rijen.map((id) => `<tr><td><b>${esc(naamVan(id))}</b></td>${dagen.map((s) => {
        const b = besch.find((x) => x.medewerker_id === id && x.datum === s);
        const hier = diensten.filter((d) => d.medewerker_id === id && d.datum === s && d.afdeling === a);
        const dicht = !afdOpen(a, s);
        return `<td class="cel ${s === nu ? "vandaag" : ""} ${dicht && !hier.length ? "dicht" : ""}">
          <span class="besch ${b?.status || ""}"${b?.opmerking ? ` title="${esc(b.opmerking)}"` : ""}>${beschTekst(b)}${b?.opmerking ? " *" : ""}</span>
          ${hier.map((d) => `<button class="chip" type="button" data-dienst="${d.id}"><b>${tijd(d.start_tijd)}–${tijd(d.eind_tijd)}${d.patroon_id ? ` <span title="Onderdeel van een patroon" aria-label="Onderdeel van een patroon">↻</span>` : ""}</b>${d.opmerking ? `<small>${esc(d.opmerking)}</small>` : ""}</button>`).join("")}
          <button class="plus" type="button" data-nieuw="${id}|${a}|${s}" aria-label="Dienst toevoegen voor ${esc(naamVan(id))} op ${esc(dagLang(s))}">+</button>
        </td>`;
      }).join("")}</tr>`).join("")}</tbody></table></div>`
      : `<div class="leeg" style="padding:12px">Nog geen medewerkers bij ${AFD[a].naam.toLowerCase()}. Voeg ze toe onder <a href="#medewerkers">Medewerkers</a>.</div>`}
    </section>`;
  }).join("");
  $("inhoud").innerHTML = `
    <div class="kop"><h1>Plannen</h1>${weekNavHtml()}</div>
    <div class="kop" style="margin-bottom:20px">
      <button class="btn" id="kopieer" type="button">Rooster van vorige week overnemen</button>
    </div>
    ${secties}`;
  $("kopieer").addEventListener("click", kopieerWeek);
  $("inhoud").querySelectorAll("[data-nieuw]").forEach((k) => k.addEventListener("click", () => {
    const [id, afd, datum] = k.dataset.nieuw.split("|");
    dienstDialoog({ medewerker_id: id, afdeling: afd, datum });
  }));
  $("inhoud").querySelectorAll("[data-dienst]").forEach((k) => k.addEventListener("click", () => {
    dienstDialoog(planData.diensten.find((d) => d.id === k.dataset.dienst));
  }));
}
function beschTekst(b) {
  if (!b) return "Niet opgegeven";
  if (b.status === "beschikbaar") return "Beschikbaar";
  if (b.status === "niet") return "Niet beschikbaar";
  return `${tijd(b.van)}–${tijd(b.tot)}`;
}
function overlapt(a, b) { return a.start < b.eind && b.start < a.eind; }

function dienstDialoog(d) {
  const nieuw = !d.id;
  const standaard = (() => { try { return JSON.parse(opslag.get("gz-tijden-" + d.afdeling) || "null"); } catch (e) { return null; } })();
  const start = tijd(d.start_tijd) || standaard?.start || "09:00";
  const eind = tijd(d.eind_tijd) || standaard?.eind || "17:00";
  const b = planData.besch.find((x) => x.medewerker_id === d.medewerker_id && x.datum === d.datum);
  openDialoog(`<form method="dialog">
    <h2>${esc(naamVan(d.medewerker_id))}</h2>
    <p class="sub2">${esc(dagLang(d.datum))}. Beschikbaarheid: ${esc(beschTekst(b).toLowerCase())}${b?.opmerking ? ` (${esc(b.opmerking)})` : ""}</p>
    <label class="veld">Afdeling <select id="dAfd">${AFD_IDS.map((a) => `<option value="${a}"${a === d.afdeling ? " selected" : ""}>${AFD[a].naam}</option>`).join("")}</select></label>
    <div class="twee">
      <label class="veld">Begin <input type="time" id="dStart" value="${start}" required></label>
      <label class="veld">Einde <input type="time" id="dEind" value="${eind}" required></label>
    </div>
    <label class="veld">Opmerking <input type="text" id="dOpm" value="${esc(d.opmerking)}" placeholder="Bijvoorbeeld kassa of mise en place"></label>
    ${d.patroon_id ? `<label class="check"><input type="checkbox" id="dAlle"> Ook alle volgende diensten van dit patroon wijzigen</label>` : `<div class="twee">
      <label class="veld">Herhalen <select id="dStap">
        <option value="0">Niet herhalen</option>
        <option value="7">Elke ${esc(fmt(d.datum, { weekday: "long" }))}</option>
        <option value="14">Om de week op ${esc(fmt(d.datum, { weekday: "long" }))}</option>
      </select></label>
      <label class="veld" id="dEindeVeld" hidden>Tot en met <input type="date" id="dEinde" value="${plus(d.datum, PATROON_STANDAARD_DAGEN)}" min="${d.datum}" max="${plus(d.datum, PATROON_MAX_DAGEN)}"></label>
    </div>`}
    <div class="hint" id="dHint" hidden></div>
    <div class="knoppen">
      ${nieuw ? "" : `<button class="btn gevaar" type="button" id="dWeg">Dienst verwijderen</button>`}
      ${d.patroon_id ? `<button class="btn gevaar" type="button" id="dWegAlle">Ook alle volgende verwijderen</button>` : ""}
      <div class="rechts"><button class="btn" type="button" data-sluit>Annuleren</button><button class="btn primair" type="submit">Opslaan</button></div>
    </div>
  </form>`, async () => {
    const rij = { medewerker_id: d.medewerker_id, datum: d.datum, afdeling: $("dAfd").value, start_tijd: $("dStart").value, eind_tijd: $("dEind").value, opmerking: $("dOpm").value.trim() || null };
    if (rij.eind_tijd <= rij.start_tijd) throw new Error("De eindtijd moet na de begintijd liggen.");
    const dubbel = planData.diensten.find((x) => x.id !== d.id && x.medewerker_id === d.medewerker_id && x.datum === d.datum
      && overlapt({ start: rij.start_tijd, eind: rij.eind_tijd }, { start: tijd(x.start_tijd), eind: tijd(x.eind_tijd) }));
    if (dubbel) throw new Error(`Overlapt met de dienst van ${tijd(dubbel.start_tijd)} tot ${tijd(dubbel.eind_tijd)} in ${AFD[dubbel.afdeling].naam.toLowerCase()}.`);
    const stap = Number($("dStap")?.value || 0);
    const alle = !!$("dAlle")?.checked;
    if (stap) controleerPatroonEinde(d.datum, $("dEinde").value);
    const tekst = alle ? await wijzigVolgende(d, rij) : stap ? await maakDienstPatroon(d, rij, stap, $("dEinde").value) : await slaDienstOp(d, rij);
    opslag.set("gz-tijden-" + rij.afdeling, JSON.stringify({ start: rij.start_tijd, eind: rij.eind_tijd }));
    sluitDialoog();
    melding(tekst);
    ververs();
  });
  $("dStap")?.addEventListener("change", () => { $("dEindeVeld").hidden = $("dStap").value === "0"; });
  const hint = () => {
    const el = $("dHint"); if (!el) return;
    let t = "";
    const s = $("dStart").value, e = $("dEind").value;
    if (b?.status === "niet") t = "Deze persoon heeft aangegeven dan niet te kunnen.";
    else if (b?.status === "deels" && (s < tijd(b.van) || e > tijd(b.tot))) t = `Deze persoon kan alleen van ${tijd(b.van)} tot ${tijd(b.tot)}.`;
    el.textContent = t; el.hidden = !t;
  };
  hint();
  $("dStart").addEventListener("change", hint);
  $("dEind").addEventListener("change", hint);
  $("dWeg")?.addEventListener("click", async () => {
    try {
      check(await sb.from("diensten").delete().eq("id", d.id));
      sluitDialoog(); melding("Dienst verwijderd"); ververs();
    } catch (e) { melding(foutTekst(e), true); }
  });
  let wegBevestigd = false;
  $("dWegAlle")?.addEventListener("click", async (e) => {
    try {
      const volgende = () => sb.from("diensten").delete().eq("patroon_id", d.patroon_id).gte("datum", d.datum);
      if (!wegBevestigd) {
        const rijen = check(await sb.from("diensten").select("id").eq("patroon_id", d.patroon_id).gte("datum", d.datum));
        wegBevestigd = true;
        e.target.textContent = `Bevestig: ${rijen.length} ${rijen.length === 1 ? "dienst" : "diensten"} verwijderen`;
        return;
      }
      const weg = check(await volgende().select("id"));
      sluitDialoog();
      melding(`${weg.length} ${weg.length === 1 ? "dienst" : "diensten"} verwijderd`);
      ververs();
    } catch (err) { melding(foutTekst(err), true); }
  });
}

async function slaDienstOp(d, rij) {
  if (d.id) check(await sb.from("diensten").update(rij).eq("id", d.id));
  else check(await sb.from("diensten").insert(rij));
  return "Dienst opgeslagen";
}
const eigenDienstenVanaf = (id, van, tot) => {
  let q = sb.from("diensten").select("*").eq("medewerker_id", id).gte("datum", van);
  if (tot) q = q.lte("datum", tot);
  return q;
};
const zelfdeTijd = (r, x) => overlapt({ start: tijd(r.start_tijd), eind: tijd(r.eind_tijd) }, { start: tijd(x.start_tijd), eind: tijd(x.eind_tijd) });

async function maakDienstPatroon(d, rij, stap, einde) {
  const datums = patroonDatums(d.datum, stap, einde);
  const patroon_id = nieuweId();
  const [bestaand, besch] = await Promise.all([
    eigenDienstenVanaf(d.medewerker_id, d.datum, einde).then(check),
    sb.from("beschikbaarheid").select("datum,status").eq("medewerker_id", d.medewerker_id).gte("datum", d.datum).lte("datum", einde).then(check),
  ]);
  const vrij = datums.filter((s) => !bestaand.some((x) => x.id !== d.id && x.datum === s && zelfdeTijd(rij, x)));
  const rijen = vrij.filter((s) => s !== d.datum || !d.id).map((s) => ({ ...rij, datum: s, patroon_id }));
  if (d.id) check(await sb.from("diensten").update({ ...rij, patroon_id }).eq("id", d.id));
  if (rijen.length) check(await sb.from("diensten").insert(rijen));
  const nietBeschikbaar = vrij.filter((s) => besch.some((b) => b.datum === s && b.status === "niet")).length;
  const overgeslagen = datums.length - vrij.length;
  return [
    `${vrij.length} ${vrij.length === 1 ? "dienst" : "diensten"} gepland`,
    overgeslagen ? `${overgeslagen} overgeslagen (stond al iets)` : "",
    nietBeschikbaar ? `${nietBeschikbaar} op een dag dat deze persoon niet kan` : "",
  ].filter(Boolean).join(", ");
}

async function wijzigVolgende(d, rij) {
  const alleDiensten = check(await eigenDienstenVanaf(d.medewerker_id, d.datum));
  const reeks = alleDiensten.filter((x) => x.patroon_id === d.patroon_id);
  const botsing = alleDiensten.find((x) => x.patroon_id !== d.patroon_id && reeks.some((r) => r.datum === x.datum) && zelfdeTijd(rij, x));
  if (botsing) throw new Error(`Op ${dagLang(botsing.datum)} staat al een dienst van ${tijd(botsing.start_tijd)} tot ${tijd(botsing.eind_tijd)}.`);
  const { afdeling, start_tijd, eind_tijd, opmerking } = rij;
  check(await sb.from("diensten").update({ afdeling, start_tijd, eind_tijd, opmerking }).eq("patroon_id", d.patroon_id).gte("datum", d.datum));
  return `${reeks.length} ${reeks.length === 1 ? "dienst" : "diensten"} gewijzigd`;
}

async function kopieerWeek() {
  try {
    const vorige = await haalDiensten(plus(weekStart, -7), plus(weekStart, -1));
    const huidig = planData.diensten;
    const actief = new Set(medewerkers.filter((m) => m.actief).map((m) => m.id));
    const rijen = vorige.map((d) => ({ medewerker_id: d.medewerker_id, afdeling: d.afdeling, datum: plus(d.datum, 7), start_tijd: d.start_tijd, eind_tijd: d.eind_tijd, opmerking: d.opmerking }))
      .filter((r) => actief.has(r.medewerker_id) && !huidig.some((x) => x.medewerker_id === r.medewerker_id && x.datum === r.datum
        && overlapt({ start: tijd(r.start_tijd), eind: tijd(r.eind_tijd) }, { start: tijd(x.start_tijd), eind: tijd(x.eind_tijd) })));
    if (!rijen.length) { melding("Er is niets om over te nemen."); return; }
    check(await sb.from("diensten").insert(rijen));
    melding(rijen.length === 1 ? "1 dienst overgenomen" : `${rijen.length} diensten overgenomen`);
    ververs();
  } catch (e) { melding(foutTekst(e), true); }
}

/* ---------- Uren ---------- */
async function tekenUren() {
  if (!urenFilter.van) {
    const d = new Date();
    urenFilter.van = iso(new Date(d.getFullYear(), d.getMonth(), 1));
    urenFilter.tot = iso(new Date(d.getFullYear(), d.getMonth() + 1, 0));
  }
  const f = urenFilter;
  if (isBeheerder()) await laadMedewerkers();
  let qk = sb.from("kloktijden").select("*").gte("datum", f.van).lte("datum", f.tot).order("in_tijd");
  let qd = sb.from("diensten").select("*").gte("datum", f.van).lte("datum", f.tot).order("start_tijd");
  const wie = isBeheerder() ? f.medewerker : ik.id;
  if (wie) { qk = qk.eq("medewerker_id", wie); qd = qd.eq("medewerker_id", wie); }
  if (f.afdeling) { qk = qk.eq("afdeling", f.afdeling); qd = qd.eq("afdeling", f.afdeling); }
  const [klok, diensten] = await Promise.all([qk.then(check), qd.then(check)]);

  const nu = vandaag();
  const nuTijd = new Date().toTimeString().slice(0, 5);
  const begonnen = (d) => d.datum < nu || (d.datum === nu && tijd(d.start_tijd) <= nuTijd);
  const ids = [...new Set([...klok.map((k) => k.medewerker_id), ...diensten.filter(begonnen).map((d) => d.medewerker_id)])].sort((x, y) => naamVan(x).localeCompare(naamVan(y)));
  let aantalOpen = 0;
  const blokken = ids.map((id) => {
    const rijen = [];
    klok.filter((k) => k.medewerker_id === id).forEach((k) => {
      const d = diensten.find((x) => x.id === k.dienst_id);
      rijen.push({ datum: k.datum, volg: k.in_tijd, k, d });
    });
    diensten.filter((d) => d.medewerker_id === id && !klok.some((k) => k.dienst_id === d.id)).forEach((d) => {
      if (begonnen(d)) rijen.push({ datum: d.datum, volg: d.datum + "T" + d.start_tijd, d });
    });
    rijen.sort((a, b) => (a.datum + a.volg).localeCompare(b.datum + b.volg));
    let totaal = 0, gepland = 0;
    diensten.filter((d) => d.medewerker_id === id && begonnen(d)).forEach((d) => (gepland += dienstMin(d)));
    const regels = rijen.map((r) => {
      const { k, d } = r;
      if (!k) {
        return `<tr class="mist"><td>${esc(dagKort(r.datum))}</td><td>${esc(AFD[d.afdeling].naam)}</td><td>${tijd(d.start_tijd)}–${tijd(d.eind_tijd)}</td><td colspan="3"><span class="vlag">${d.datum === nu ? "Nog niet ingeklokt" : "Niet ingeklokt"}</span></td><td class="n">–</td>
          <td class="acties">${isBeheerder() ? `<button type="button" data-klok-nieuw="${d.id}">Invullen</button>` : ""}</td></tr>`;
      }
      const m = klokMin(k);
      totaal += m;
      const openVan = !k.uit_tijd && k.datum < nu;
      if (openVan) aantalOpen++;
      const vlag = openVan ? `<span class="vlag">Niet uitgeklokt</span>` : !k.uit_tijd ? `<span class="vlag stil">Nog aan het werk</span>` : k.gecorrigeerd_op ? `<span class="vlag stil" title="${esc(k.opmerking ?? "")}">${aangepastTekst(k)}</span>` : !k.dienst_id ? `<span class="vlag stil">Niet ingepland</span>` : "";
      return `<tr><td>${esc(dagKort(k.datum))}</td><td>${esc(AFD[k.afdeling]?.naam ?? "")}</td><td>${d ? `${tijd(d.start_tijd)}–${tijd(d.eind_tijd)}` : "–"}</td><td>${klokTijd(k.in_tijd)}</td><td>${klokTijd(k.uit_tijd) || vlag}</td><td class="n">${k.pauze_minuten ? k.pauze_minuten + " min" : "–"}</td><td class="n"><b>${k.uit_tijd ? urenTekst(m) : "–"}</b>${k.uit_tijd && vlag ? `<br>${vlag}` : ""}</td>
        <td class="acties">${isBeheerder() ? `<button type="button" data-klok="${k.id}">Aanpassen</button>` : k.datum >= plus(nu, -14) ? `<button type="button" data-eigen-uren="${k.id}">Aanpassen</button>` : ""}</td></tr>`;
    }).join("");
    return { id, totaal, html: `<section class="urenblok">
      <div class="urenkop"><h2>${esc(naamVan(id))}</h2><span>${gepland ? `ingepland ${urenTekst(gepland)}` : ""}</span><strong>${urenTekst(totaal)} uur</strong><span>(${urenDec(totaal)})</span></div>
      <div class="urenschuif"><table class="uren"><thead><tr><th>Datum</th><th>Afdeling</th><th>Ingepland</th><th>In</th><th>Uit</th><th class="n">Pauze</th><th class="n">Gewerkt</th><th class="acties"></th></tr></thead>
      <tbody>${regels || `<tr><td colspan="8">Geen uren in deze periode.</td></tr>`}</tbody></table></div>
    </section>` };
  });
  const som = blokken.reduce((t, b) => t + b.totaal, 0);
  const periode = `${fmt(f.van, { day: "numeric", month: "long", year: "numeric" })} tot en met ${fmt(f.tot, { day: "numeric", month: "long", year: "numeric" })}`;
  const totaalBlok = isBeheerder() && blokken.length > 1 ? `<section class="urenblok">
    <div class="urenkop"><h2>Totaal per medewerker</h2><strong>${urenTekst(som)} uur</strong><span>(${urenDec(som)})</span></div>
    <div class="urenschuif"><table class="uren"><thead><tr><th>Medewerker</th><th class="n">Uren</th><th class="n">Decimaal</th></tr></thead>
    <tbody>${blokken.map((b) => `<tr><td>${esc(naamVan(b.id))}</td><td class="n">${urenTekst(b.totaal)}</td><td class="n">${urenDec(b.totaal)}</td></tr>`).join("")}</tbody></table></div>
  </section>` : "";

  $("inhoud").innerHTML = `
    <div class="kop"><h1>${isBeheerder() ? "Uren" : "Mijn uren"}</h1>
      ${isBeheerder() ? `<button class="btn" id="urenNieuw" type="button">Uren toevoegen</button>` : ""}
      <button class="btn primair" id="urenPrint" type="button">Uren printen</button></div>
    <div class="filters">
      <label class="veld">Periode <select id="fPeriode">
        <option value="">Zelf kiezen</option><option value="week">Deze week</option><option value="vorigeweek">Vorige week</option>
        <option value="maand">Deze maand</option><option value="vorigemaand">Vorige maand</option></select></label>
      <label class="veld">Van <input type="date" id="fVan" value="${f.van}"></label>
      <label class="veld">Tot en met <input type="date" id="fTot" value="${f.tot}"></label>
      <label class="veld">Afdeling <select id="fAfd"><option value="">Alle afdelingen</option>${AFD_IDS.map((a) => `<option value="${a}"${a === f.afdeling ? " selected" : ""}>${AFD[a].naam}</option>`).join("")}</select></label>
      ${isBeheerder() ? `<label class="veld">Medewerker <select id="fMw"><option value="">Iedereen</option>${medewerkers.map((m) => `<option value="${m.id}"${m.id === f.medewerker ? " selected" : ""}>${esc(m.naam)}</option>`).join("")}</select></label>` : ""}
    </div>
    <div class="printkop"><div><h1>Urenoverzicht</h1><p>${esc(periode)}${f.afdeling ? `, ${esc(AFD[f.afdeling].naam.toLowerCase())}` : ""}</p><p>Geprint op ${esc(dagLang(nu))}</p></div><img alt="Graan &amp; Zo" src="${LOGO_PRINT}"></div>
    ${aantalOpen ? `<div class="waarschuwing">${aantalOpen === 1 ? "1 dienst heeft" : aantalOpen + " diensten hebben"} geen uitkloktijd en ${aantalOpen === 1 ? "telt" : "tellen"} niet mee in de totalen.${isBeheerder() ? " Klik op Aanpassen om de eindtijd in te vullen." : " Klik op Aanpassen om je uittijd in te vullen, of vraag het de beheerder als dat niet meer kan."}</div>` : ""}
    ${totaalBlok}
    ${blokken.map((b) => b.html).join("") || `<div class="leeg"><strong>Geen uren in deze periode</strong>Kies een andere periode of afdeling.</div>`}`;

  $("urenPrint").addEventListener("click", () => window.print());
  const nieuwFilter = () => {
    Object.assign(urenFilter, { van: $("fVan").value, tot: $("fTot").value, afdeling: $("fAfd").value, medewerker: $("fMw")?.value ?? "" });
    if (urenFilter.van && urenFilter.tot) ververs();
  };
  ["fVan", "fTot", "fAfd", "fMw"].forEach((id) => $(id)?.addEventListener("change", nieuwFilter));
  $("fPeriode").addEventListener("change", (e) => {
    const d = new Date(); const y = d.getFullYear(), m = d.getMonth();
    const week = maandag(nu);
    const opties = {
      week: [week, plus(week, 6)], vorigeweek: [plus(week, -7), plus(week, -1)],
      maand: [iso(new Date(y, m, 1)), iso(new Date(y, m + 1, 0))], vorigemaand: [iso(new Date(y, m - 1, 1)), iso(new Date(y, m, 0))],
    }[e.target.value];
    if (opties) { [urenFilter.van, urenFilter.tot] = opties; ververs(); }
  });
  $("urenNieuw")?.addEventListener("click", () => klokDialoog({ medewerker_id: urenFilter.medewerker || "", datum: nu, afdeling: urenFilter.afdeling || "" }));
  $("inhoud").querySelectorAll("[data-eigen-uren]").forEach((k) => k.addEventListener("click", () => eigenUrenDialoog(klok.find((x) => x.id === k.dataset.eigenUren))));
  $("inhoud").querySelectorAll("[data-klok]").forEach((k) => k.addEventListener("click", () => klokDialoog(klok.find((x) => x.id === k.dataset.klok))));
  $("inhoud").querySelectorAll("[data-klok-nieuw]").forEach((k) => k.addEventListener("click", () => {
    const d = diensten.find((x) => x.id === k.dataset.klokNieuw);
    klokDialoog({ medewerker_id: d.medewerker_id, datum: d.datum, afdeling: d.afdeling, dienst_id: d.id, _in: tijd(d.start_tijd), _uit: tijd(d.eind_tijd) });
  }));
}

function aangepastTekst(k) {
  const zelf = k.gecorrigeerd_door === k.medewerker_id;
  const was = k.in_oorspronkelijk ? ` (was ${klokTijd(k.in_oorspronkelijk)}–${klokTijd(k.uit_oorspronkelijk) || "open"})` : "";
  return `${zelf ? "Zelf aangepast" : "Aangepast"}${was}`;
}

function klokDialoog(k) {
  const nieuw = !k.id;
  const inT = k._in ?? klokTijd(k.in_tijd);
  const uitT = k._uit ?? klokTijd(k.uit_tijd);
  const opties = medewerkers.filter((m) => m.actief || m.id === k.medewerker_id);
  openDialoog(`<form method="dialog">
    <h2>${nieuw ? "Uren toevoegen" : "Uren aanpassen"}</h2>
    ${k.medewerker_id ? `<p class="sub2">${esc(naamVan(k.medewerker_id))}</p>` : `<label class="veld">Medewerker <select id="kMw" required><option value="">Kies</option>${opties.map((m) => `<option value="${m.id}">${esc(m.naam)}</option>`).join("")}</select></label>`}
    <div class="twee">
      <label class="veld">Datum <input type="date" id="kDatum" value="${k.datum}" required></label>
      <label class="veld">Afdeling <select id="kAfd" required><option value="">Kies</option>${AFD_IDS.map((a) => `<option value="${a}"${a === k.afdeling ? " selected" : ""}>${AFD[a].naam}</option>`).join("")}</select></label>
    </div>
    <div class="twee">
      <label class="veld">In <input type="time" id="kIn" value="${inT}" required></label>
      <label class="veld">Uit <input type="time" id="kUit" value="${uitT}"></label>
    </div>
    <label class="veld">Pauze in minuten <input type="number" id="kPauze" min="0" max="480" step="5" value="${k.pauze_minuten ?? 0}"></label>
    <label class="veld">Reden of opmerking <input type="text" id="kOpm" value="${esc(k.opmerking)}" placeholder="Bijvoorbeeld vergeten uit te klokken"></label>
    <div class="knoppen">
      ${nieuw ? "" : `<button class="btn gevaar" type="button" id="kWeg">Verwijderen</button>`}
      <div class="rechts"><button class="btn" type="button" data-sluit>Annuleren</button><button class="btn primair" type="submit">Opslaan</button></div>
    </div>
  </form>`, async () => {
    const datum = $("kDatum").value, inV = $("kIn").value, uitV = $("kUit").value;
    const pauze = Number($("kPauze").value || 0);
    if (uitV && uitV <= inV) throw new Error("De uittijd moet na de intijd liggen.");
    if (uitV && pauze >= minuten(uitV) - minuten(inV)) throw new Error("De pauze is langer dan de gewerkte tijd.");
    const rij = {
      medewerker_id: k.medewerker_id || $("kMw").value, datum, afdeling: $("kAfd").value, pauze_minuten: pauze,
      in_tijd: new Date(`${datum}T${inV}`).toISOString(), uit_tijd: uitV ? new Date(`${datum}T${uitV}`).toISOString() : null,
      opmerking: $("kOpm").value.trim() || null,
    };
    if (k.dienst_id) rij.dienst_id = k.dienst_id;
    if (nieuw) check(await sb.from("kloktijden").insert(rij));
    else check(await sb.from("kloktijden").update(rij).eq("id", k.id));
    sluitDialoog(); melding("Uren opgeslagen"); ververs();
  });
  $("kWeg")?.addEventListener("click", async () => {
    try {
      check(await sb.from("kloktijden").delete().eq("id", k.id));
      sluitDialoog(); melding("Uren verwijderd"); ververs();
    } catch (e) { melding(foutTekst(e), true); }
  });
}

/* ---------- Medewerkers ---------- */
async function laadMedewerkers() {
  medewerkers = check(await sb.from("medewerkers").select("*").order("naam"));
}
async function beheer(body) {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(SUPABASE_URL + "/functions/v1/medewerker-beheer", {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY, Authorization: "Bearer " + session.access_token },
    body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.fout || "Dat is niet gelukt. Probeer het opnieuw.");
  return j;
}
async function tekenMedewerkers() {
  await laadMedewerkers();
  const volgorde = [...medewerkers].sort((a, b) => (b.actief - a.actief) || a.naam.localeCompare(b.naam));
  $("inhoud").innerHTML = `
    <div class="kop"><h1>Medewerkers</h1><button class="btn primair" id="mwNieuw" type="button">Medewerker toevoegen</button></div>
    <div class="lijst">${volgorde.map((m) => `<div class="${m.actief ? "" : "uit"}">
      <div class="nm"><b>${esc(m.naam)}</b><small>${m.gebruikersnaam ? "Inlognaam " + esc(m.gebruikersnaam) : "Logt in met e-mail"}${m.rol === "beheerder" ? ", beheerder" : ""}${m.actief ? "" : ", niet actief"}</small></div>
      <span class="af">${m.afdelingen.map((a) => `<span class="tag ${kolomAfd(a)}">${AFD[a].naam}</span>`).join("")}</span>
      <button class="btn" type="button" data-mw="${m.id}">Wijzigen</button>
    </div>`).join("")}</div>
    <p class="sub" style="margin-top:12px">Medewerkers krijgen geen mail. Geef ze hun inlognaam en het wachtwoord zelf door; ze kunnen het wachtwoord daarna zelf wijzigen.</p>`;
  $("mwNieuw").addEventListener("click", () => mwDialoog({ afdelingen: [], rol: "medewerker", actief: true }));
  $("inhoud").querySelectorAll("[data-mw]").forEach((k) => k.addEventListener("click", () => mwDialoog(mw(k.dataset.mw))));
}
function mwDialoog(m) {
  const nieuw = !m.id;
  const zelf = m.id === ik.id;
  openDialoog(`<form method="dialog">
    <h2>${nieuw ? "Medewerker toevoegen" : esc(m.naam)}</h2>
    <label class="veld">Naam <input type="text" id="mNaam" value="${esc(m.naam)}" required></label>
    ${nieuw ? `<label class="veld">Inlognaam <input type="text" id="mInlog" required autocapitalize="none" spellcheck="false" pattern="[a-z0-9][a-z0-9._\\-]{1,30}" title="Kleine letters en cijfers, zonder spaties"></label>` : ""}
    <label class="veld">${nieuw ? "Wachtwoord" : "Nieuw wachtwoord (laat leeg om niet te wijzigen)"} <input type="text" id="mWw" minlength="8" autocomplete="off" ${nieuw ? "required" : ""}></label>
    <fieldset><legend>Afdelingen</legend>
      ${AFD_IDS.map((a) => `<label class="check"><input type="checkbox" data-afd="${a}"${m.afdelingen.includes(a) ? " checked" : ""}> ${AFD[a].naam}</label>`).join("")}
    </fieldset>
    <label class="veld">Rol <select id="mRol"${zelf ? " disabled" : ""}>
      <option value="medewerker"${m.rol === "medewerker" ? " selected" : ""}>Medewerker</option>
      <option value="beheerder"${m.rol === "beheerder" ? " selected" : ""}>Beheerder (plant en ziet alle uren)</option></select></label>
    ${nieuw || zelf ? "" : `<label class="check"><input type="checkbox" id="mActief"${m.actief ? " checked" : ""}> Actief (kan inloggen en wordt ingepland)</label>`}
    <div class="knoppen"><div class="rechts" style="margin-left:auto"><button class="btn" type="button" data-sluit>Annuleren</button><button class="btn primair" type="submit">${nieuw ? "Toevoegen" : "Opslaan"}</button></div></div>
  </form>`, async () => {
    const afdelingen = [...document.querySelectorAll("[data-afd]:checked")].map((c) => c.dataset.afd);
    const ww = $("mWw").value;
    if (nieuw) {
      await beheer({ actie: "aanmaken", naam: $("mNaam").value, gebruikersnaam: $("mInlog").value, wachtwoord: ww, rol: $("mRol").value, afdelingen });
    } else {
      const velden = { actie: "wijzigen", id: m.id, naam: $("mNaam").value, afdelingen };
      if (!zelf) { velden.rol = $("mRol").value; velden.actief = $("mActief").checked; }
      await beheer(velden);
      if (ww) await beheer({ actie: "wachtwoord", id: m.id, wachtwoord: ww });
    }
    sluitDialoog();
    melding(nieuw ? "Medewerker toegevoegd" : "Opgeslagen");
    if (m.id === ik.id) { ik = (await laadMedewerkers(), mw(ik.id)); }
    ververs();
  });
  if (nieuw) {
    $("mNaam").addEventListener("input", () => {
      const inlog = $("mInlog");
      if (inlog.dataset.handmatig) return;
      inlog.value = $("mNaam").value.split(" ")[0].normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
    });
    $("mInlog").addEventListener("input", (e) => (e.target.dataset.handmatig = "1"));
  }
}

/* ---------- Dialoog ---------- */
function openDialoog(html, opSubmit) {
  const dlg = $("dlg");
  dlg.innerHTML = html;
  dlg.querySelector("[data-sluit]")?.addEventListener("click", sluitDialoog);
  const f = dlg.querySelector("form");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const knop = f.querySelector('[type="submit"]');
    knop.disabled = true;
    try { await opSubmit(); } catch (err) { melding(foutTekst(err), true); }
    knop.disabled = false;
  });
  dlg.showModal();
}
function sluitDialoog() { $("dlg").close(); }

/* ---------- Eigen wachtwoord ---------- */
$("wwKnop").addEventListener("click", () => {
  openDialoog(`<form method="dialog">
    <h2>Wachtwoord wijzigen</h2>
    <label class="veld">Nieuw wachtwoord <input type="password" id="wwNieuw" minlength="8" required autocomplete="new-password"></label>
    <div class="knoppen"><div class="rechts" style="margin-left:auto"><button class="btn" type="button" data-sluit>Annuleren</button><button class="btn primair" type="submit">Wachtwoord opslaan</button></div></div>
  </form>`, async () => {
    const { error } = await sb.auth.updateUser({ password: $("wwNieuw").value });
    if (error) throw error;
    sluitDialoog();
    melding("Wachtwoord opgeslagen");
  });
});

/* ---------- Inloggen ---------- */
function toonLogin() {
  ik = null;
  clearInterval(verversTimer);
  if (kanaal) { sb.removeChannel(kanaal); kanaal = null; }
  $("app").hidden = true;
  $("login").hidden = false;
  $("wachtwoord").value = "";
  $("gedeeld").checked = opslag.get("gz-gedeeld") === "1";
}
async function toonApp(session) {
  const eigen = await sb.from("medewerkers").select("*").eq("user_id", session.user.id).maybeSingle();
  if (eigen.error || !eigen.data || !eigen.data.actief) {
    await sb.auth.signOut();
    toonLogin();
    $("loginFout").textContent = eigen.error ? foutTekst(eigen.error) : "Dit account heeft geen toegang tot de planning. Vraag een beheerder om je toe te voegen.";
    return;
  }
  ik = eigen.data;
  await laadMedewerkers();
  $("login").hidden = true;
  $("app").hidden = false;
  $("gebruiker").textContent = ik.naam;
  await toon();
  // Rooster blijft actueel: direct bij wijzigingen, en elke minuut voor de klokstatus en de nu-lijn.
  kanaal = sb.channel("planning").on("postgres_changes", { event: "*", schema: "public", table: "diensten" }, () => {
    if (!$("dlg").open && (weergave === "vandaag" || weergave === "plannen")) ververs();
  }).subscribe();
  clearInterval(verversTimer);
  verversTimer = setInterval(() => {
    if (!$("dlg").open && weergave === "vandaag" && !document.hidden) ververs();
  }, 60000);
}
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const knop = $("loginKnop");
  knop.disabled = true; knop.textContent = "Bezig met inloggen…";
  $("loginFout").textContent = "";
  opslag.set("gz-gedeeld", $("gedeeld").checked ? "1" : "0");
  const invoer = $("inlognaam").value.trim().toLowerCase();
  const email = invoer.includes("@") ? invoer : `medewerker+${invoer}@graanenzo.nl`;
  const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 15000));
  try {
    const { data, error } = await Promise.race([sb.auth.signInWithPassword({ email, password: $("wachtwoord").value }), timeout]);
    if (error) {
      $("loginFout").textContent = /invalid/i.test(error.message) ? "Inloggen mislukt. Controleer je inlognaam en wachtwoord."
        : /banned/i.test(error.message) ? "Dit account staat op non-actief. Neem contact op met een beheerder."
        : "Inloggen mislukt: " + error.message;
      return;
    }
    await toonApp(data.session);
  } catch (err) {
    $("loginFout").textContent = "Geen verbinding met de server. Controleer je internet en probeer het opnieuw.";
  } finally {
    knop.disabled = false; knop.textContent = "Inloggen";
  }
});
$("uitloggen").addEventListener("click", async () => { await sb.auth.signOut(); toonLogin(); });
sb.auth.getSession().then(({ data }) => (data.session ? toonApp(data.session) : toonLogin()));
</script>
</body>
</html>
